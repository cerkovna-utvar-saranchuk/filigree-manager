<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101414"><title>FILIGREE ARTS — Manager Assistant</title><style>
:root{--bg:#101414;--panel:#1b2020;--panel2:#252b2a;--gold:#d1b47e;--text:#f2eee5;--muted:#a5aaa5;--line:#343a38}*{box-sizing:border-box}body{margin:0;background:#090c0c;color:var(--text);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:480px;min-height:100dvh;margin:auto;background:var(--bg);padding:0 18px 100px;box-shadow:0 0 50px #0006}.top{position:sticky;top:0;z-index:5;background:#101414ed;backdrop-filter:blur(14px);padding:22px 0 14px;border-bottom:1px solid var(--line)}.brand{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:700}.toprow{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:22px;font-weight:550;margin:5px 0 0}.round{border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--gold);width:40px;height:40px}.content{padding-top:22px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:1.8px;text-transform:uppercase}.hero{padding:22px;background:linear-gradient(130deg,#30332d,#1c2322 70%);border:1px solid #4c493a;border-radius:20px;margin-bottom:24px}.hero h2{font-size:26px;line-height:1.18;font-weight:500;margin:10px 0}.hero p{color:#c3c8c0;line-height:1.55;margin:0 0 20px}.primary{border:0;border-radius:12px;background:var(--gold);color:#171a17;padding:13px 16px;font-weight:700}.secondary{border:1px solid #605843;border-radius:12px;background:#292b26;color:var(--gold);padding:12px 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{min-height:138px;background:var(--panel);border:1px solid var(--line);border-radius:17px;text-align:left;color:var(--text);padding:17px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}.tile .ico{font-size:25px;color:var(--gold)}.tile b{font-size:15px}.tile small{color:var(--muted);line-height:1.4}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 13px}.section h3{margin:0;font-size:17px;font-weight:600}.hint{color:var(--muted);font-size:12px}.search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:15px;border-radius:13px;outline:none;margin:0 0 17px}.item{display:flex;gap:13px;align-items:center;padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:15px;margin-bottom:10px;text-align:left;width:100%;color:var(--text)}.avatar{width:47px;height:47px;flex:none;border-radius:12px;background:linear-gradient(145deg,#685a3d,#2d3029);display:grid;place-items:center;font-size:23px;color:#f2d9a6}.item .copy{flex:1}.item b{display:block;margin-bottom:4px}.item small{color:var(--muted);line-height:1.5}.chev{color:var(--gold);font-size:22px}.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 12px;border-radius:100px;font-size:12px}.chip.active{background:#443c2c;color:#f2d4a2;border-color:#746244}.card{padding:17px;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}.card h3{margin:4px 0 10px}.card p,.card li{color:#c0c5c0;line-height:1.6}.card ul{padding-left:20px}.label{display:block;color:var(--muted);font-size:12px;margin:18px 0 8px}.field{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:13px;outline:none}textarea.field{min-height:90px;resize:vertical}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);padding:10px 10px calc(12px + env(safe-area-inset-bottom));background:#151919f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.nav{border:0;background:none;color:#909b94;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;padding:5px 0}.nav span{font-size:21px}.nav.active{color:var(--gold)}.detailback{background:none;border:0;color:var(--gold);padding:0 0 15px}.notice{font-size:12px;color:#cbb78d;background:#2d2b22;border:1px solid #524935;padding:13px;border-radius:12px;line-height:1.5}.stat{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.stat span{background:#31342e;color:#e6d3a9;border-radius:8px;padding:7px 10px;font-size:12px}.empty{color:var(--muted);text-align:center;padding:24px}.progress{height:4px;background:var(--line);border-radius:4px;margin:16px 0 20px}.progress div{height:100%;background:var(--gold);border-radius:4px;transition:width .2s}.footer-note{font-size:11px;color:#89948d;margin:22px 0;line-height:1.6}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.mini{font-size:12px;color:var(--muted)}@media(min-width:700px){body{padding:30px}.app{border:1px solid #3a403c;border-radius:28px;overflow:hidden;min-height:850px}.bottom{bottom:0}}
</style></head><body><div class="app"><header class="top"><div class="toprow"><div><div class="brand">FILIGREE ARTS</div><h1 id="page-title">Помічник менеджера</h1></div><button class="round" onclick="showAbout()" aria-label="Інформація">ⓘ</button></div></header><main id="main" class="content"></main></div><nav class="bottom" id="bottom"></nav><script>
const saints=[{name:'Святий Миколай',rank:'Святитель',attrs:'Єпископське облачення, Євангеліє, благословляюча рука',info:'Архієпископ Мир Лікійських. У зображеннях часто має омофор і Євангеліє.',id:'S-001',model:true},{name:'Святий Георгій',rank:'Великомученик',attrs:'Військове вбрання, спис, щит; іноді вершник',info:'Великомученик, якого часто зображують воїном.',id:'S-002',model:true},{name:'Святий Пантелеймон',rank:'Великомученик і цілитель',attrs:'Скринька з ліками, ложечка або медичний інструмент',info:'Безсрібник і цілитель. Атрибутика залежить від іконографічного типу.',id:'S-003',model:true},{name:'Свята Варвара',rank:'Великомучениця',attrs:'Хрест, чаша; в окремих традиціях — вежа',info:'Великомучениця. Атрибути можуть відрізнятися залежно від традиції.',id:'S-004',model:false},{name:'Преподобний Сергій Радонезький',rank:'Преподобний',attrs:'Чернечий одяг, сувій',info:'Преподобний чернець. Образ потребує звірки з обраним канонічним зразком.',id:'S-005',model:false},{name:'Святий архангел Михаїл',rank:'Архангел',attrs:'Крила, меч або спис, військове вбрання',info:'Небесний воєначальник; належить до ангельських чинів, а не чинів святості людей.',id:'S-006',model:false}];
const symbols=[{name:'Хризма ☧',info:'Монограма імені Христа з грецьких літер Χ і Ρ. Ранньохристиянський символ.'},{name:'Альфа й Омега Α Ω',info:'Перша й остання літери грецького алфавіту; символізують Христа як початок і кінець.'},{name:'Іхтіс ΙΧΘΥΣ',info:'Ранньохристиянський символ риби; грецька акростихічна формула віри.'},{name:'Виноградна лоза',info:'Християнський символ єднання з Христом, духовного життя та євхаристійної образності.'},{name:'Восьмикінцевий хрест',info:'Одна з традиційних форм православного хреста; конкретні форми можуть різнитися за традицією.'}];
const dates=[{day:'6 грудня / 19 грудня',name:'Святителя Миколая',note:'Дата залежить від календаря, якого дотримується громада.'},{day:'25 грудня / 7 січня',name:'Різдво Христове',note:'У різних церковних календарних практиках дата цивільного календаря відрізняється.'},{day:'6 січня / 19 січня',name:'Богоявлення (Хрещення Господнє)',note:'Перевіряйте календар клієнта.'},{day:'23 квітня / 6 травня',name:'Великомученика Георгія',note:'Приклад календарної відмінності для нерухомої пам’яті.'}];
let page='home',detail=null,filter='Усі',query='',step=1;let order=JSON.parse(localStorage.getItem('filigreeDraft')||'{}');const $=id=>document.getElementById(id);function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setPage(p){page=p;detail=null;query='';filter='Усі';render();window.scrollTo(0,0)}function nav(){let items=[['home','⌂','Головна'],['saints','♙','Святі'],['models','◇','Моделі'],['calendar','▦','Календар'],['order','✎','Замовлення']];$('bottom').innerHTML=items.map(([id,ic,t])=>`<button class="nav ${page===id?'active':''}" onclick="setPage('${id}')"><span>${ic}</span>${t}</button>`).join('')};function tile(icon,title,sub,to){return `<button class="tile" onclick="setPage('${to}')"><span class="ico">${icon}</span><b>${title}</b><small>${sub}</small></button>`}function item(title,sub,icon,action){return `<button class="item" onclick="${action}"><span class="avatar">${icon}</span><span class="copy"><b>${esc(title)}</b><small>${esc(sub)}</small></span><span class="chev">›</span></button>`}function render(){nav();let titles={home:'Помічник менеджера',saints:'Енциклопедія святих',models:'Бібліотека моделей',calendar:'Церковний календар',order:'Нове замовлення',symbols:'Символіка',learn:'Навчання'};$('page-title').textContent=titles[page];if(detail){renderDetail();return}let html='';if(page==='home'){html=`<div class="hero"><div class="eyebrow">Цифровий інструмент команди</div><h2>Знання, що допомагають продавати впевнено.</h2><p>Іконографія, готові моделі та оформлення індивідуальних замовлень — в одному місці.</p><button class="primary" onclick="setPage('order')">+ Створити замовлення</button></div><div class="section"><h3>Робочі інструменти</h3></div><div class="grid">${tile('♙','Святі','Іконографія та атрибути','saints')}${tile('◇','Каталог моделей','Демонстраційна база образів','models')}${tile('☧','Символіка','Значення християнських символів','symbols')}${tile('▦','Календар','Свята й пам’ятні дні','calendar')}${tile('✎','Замовлення','Покрокове оформлення брифу','order')}${tile('◎','Навчання','Підказки для менеджерів','learn')}</div><div class="section"><h3>Швидка довідка</h3></div>${item('Святий Миколай','Святитель · єпископське облачення','♙',"openSaint(0)")}<p class="footer-note">Демоверсія. Дані каталогу умовні; церковні та іконографічні матеріали потребують редакційної перевірки перед робочим запуском.</p>`}
if(page==='saints'){html=`<input class="search" placeholder="Пошук за іменем або чином..." value="${esc(query)}" oninput="query=this.value;updateList()"><div class="chiprow" id="chips"></div><div id="list"></div>`}
if(page==='models'){html=`<div class="notice">Каталог демонстраційний: наявність моделей не підтверджена складом або виробництвом. Після інтеграції тут будуть реальні артикули, фото й файли.</div><div class="section"><h3>Образи святих</h3><span class="hint">3 демозаписи</span></div>${saints.filter(s=>s.model).map(s=>item(s.name,`${s.id} · демомодель · ${s.rank}`,'◇',`openSaint(${saints.indexOf(s)})`)).join('')}<div class="card"><h3>Що буде в реальному каталозі?</h3><p>Фото, артикул, тип рельєфу, розмір, сумісні вироби, статус 3D-моделі та термін виготовлення.</p></div>`}
if(page==='calendar'){html=`<div class="notice">Уточнюйте календарну традицію клієнта. Наведені дати — ілюстративні приклади для нерухомих свят; не повний календар.</div><div class="section"><h3>Важливі дати</h3></div>${dates.map(d=>`<div class="card"><div class="eyebrow">${d.day}</div><h3>${d.name}</h3><p>${d.note}</p></div>`).join('')}`}
if(page==='symbols'){html=`<div class="section"><h3>Довідник символів</h3></div>${symbols.map(s=>`<div class="card"><h3>${s.name}</h3><p>${s.info}</p></div>`).join('')}<div class="notice">Для використання на ювелірних виробах враховуйте контекст, церковну традицію та погоджений дизайн.</div>`}
if(page==='learn'){html=`<div class="hero"><div class="eyebrow">Мінікурс менеджера</div><h2>Іконографія без складних термінів</h2><p>Почніть із найпоширеніших чинів святості та ознак, за якими їх можна розрізняти.</p></div>${[['Святителі','Святі єпископи та архієреї; часто зображені в архієрейському облаченні.'],['Преподобні','Святі, прославлені чернечим подвигом; часто мають чернечий одяг і сувій.'],['Мученики','Святі, які постраждали за віру; часто мають хрест як атрибут мучеництва.'],['Праведні','Святі, прославлені благочестивим життям поза обов’язковим чернечим або єпископським служінням.']].map(([a,b])=>`<div class="card"><h3>${a}</h3><p>${b}</p></div>`).join('')}<div class="notice">Це короткі навчальні підказки, а не універсальні правила розпізнавання кожної ікони.</div>`}
if(page==='order'){html=orderView()};$('main').innerHTML=html;if(page==='saints')updateList()}
function updateList(){let chips=['Усі','Святитель','Великомученик','Преподобний','Архангел'];$('chips').innerHTML=chips.map(c=>`<button class="chip ${filter===c?'active':''}" onclick="filter='${c}';updateList()">${c}</button>`).join('');let matches=saints.filter(s=>(filter==='Усі'||s.rank.includes(filter))&&(s.name+' '+s.rank+' '+s.attrs).toLowerCase().includes(query.toLowerCase()));$('list').innerHTML=matches.length?matches.map(s=>item(s.name,s.rank+' · '+s.attrs,'♙',`openSaint(${saints.indexOf(s)})`)).join(''):'<div class="empty">Нічого не знайдено</div>'}
function openSaint(i){detail=i;render();window.scrollTo(0,0)}function renderDetail(){let s=saints[detail];$('main').innerHTML=`<button class="detailback" onclick="detail=null;render()">← Повернутися</button><div class="hero"><div class="eyebrow">Іконографічна картка</div><h2>${s.name}</h2><p>${s.rank}</p></div><div class="card"><div class="eyebrow">Про святого</div><p>${s.info}</p></div><div class="card"><div class="eyebrow">Як розпізнати</div><p>${s.attrs}</p></div><div class="card"><div class="eyebrow">Моделі</div><p>${s.model?'Є умовний демозапис '+s.id+'. Фактичну наявність потрібно підтвердити.':'Демомодель відсутня. Можна створити запит на розробку нового образу.'}</p></div><button class="primary" style="width:100%" onclick="order.saint='${s.name}';save();setPage('order')">Використати в замовленні</button><p class="footer-note">Атрибути можуть відрізнятися залежно від іконографічної традиції. Перед виробництвом потрібне погодження референсу.</p>`}
function save(){localStorage.setItem('filigreeDraft',JSON.stringify(order))}function setField(k,v){order[k]=v;save()}function selectField(k,opts){return `<select class="field" onchange="setField('${k}',this.value)">${opts.map(x=>`<option ${order[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`}function orderView(){let h=`<div class="eyebrow">Крок ${step} з 3</div><div class="progress"><div style="width:${step/3*100}%"></div></div>`;if(step===1)h+=`<div class="card"><h3>1. Основна інформація</h3><label class="label">Ім’я клієнта / контакт</label><input class="field" value="${esc(order.client)}" oninput="setField('client',this.value)" placeholder="Ім’я або нікнейм"><label class="label">Тип виробу</label>${selectField('product',['Натільний хрест','Ладанка','Ланцюжок','Шнурок зі вставками'])}<label class="label">Матеріал</label>${selectField('metal',['Срібло 925','Золото 585','Комбінований','Уточнюється'])}</div>`;if(step===2)h+=`<div class="card"><h3>2. Образ і модель</h3><label class="label">Святий / сюжет</label><input class="field" value="${esc(order.saint)}" oninput="setField('saint',this.value)" placeholder="Наприклад, святий Миколай"><label class="label">Статус моделі</label>${selectField('model',['Потрібно перевірити','Готова модель','Нова розробка'])}<label class="label">Іконографічні побажання</label><textarea class="field" oninput="setField('iconography',this.value)" placeholder="Референс, атрибутика, напис, композиція">${esc(order.iconography)}</textarea></div><div class="notice">Для нового образу потрібно уточнити конкретного святого, іконографічний тип, атрибути, напис і погодити з майстром референс.</div>`;if(step===3)h+=`<div class="card"><h3>3. Деталі та підтвердження</h3><label class="label">Розміри / побажання</label><textarea class="field" oninput="setField('spec',this.value)" placeholder="Розмір, вставки, камені, термін, додаткові побажання">${esc(order.spec)}</textarea><label class="label">Підсумок</label><p><b>Клієнт:</b> ${esc(order.client||'Не вказано')}<br><b>Виріб:</b> ${esc(order.product||'Натільний хрест')}<br><b>Образ:</b> ${esc(order.saint||'Не вказано')}<br><b>Модель:</b> ${esc(order.model||'Потрібно перевірити')}</p></div><button class="secondary" style="width:100%;margin-bottom:12px" onclick="copyBrief()">Скопіювати бриф</button><button class="secondary" style="width:100%" onclick="if(confirm('Очистити демозамовлення?')){order={};step=1;save();render()}">Очистити чернетку</button>`;h+=`<div class="row" style="margin-top:18px"><button class="secondary" ${step===1?'disabled style="opacity:.35"':''} onclick="step=Math.max(1,step-1);render()">Назад</button><button class="primary" onclick="${step===3?'copyBrief()':'step=Math.min(3,step+1);render()'}">${step===3?'Скопіювати':'Далі →'}</button></div><p class="footer-note">Дані зберігаються локально у браузері цього пристрою. Це демоверсія без передачі замовлень на сервер.</p>`;return h}async function copyBrief(){let txt=`FILIGREE ARTS — ТЕХНІЧНИЙ БРИФ\nКлієнт: ${order.client||'—'}\nВиріб: ${order.product||'Натільний хрест'}\nМатеріал: ${order.metal||'Срібло 925'}\nСвятий/сюжет: ${order.saint||'—'}\nМодель: ${order.model||'Потрібно перевірити'}\nІконографія: ${order.iconography||'—'}\nПобажання: ${order.spec||'—'}\nСтатус: демочернетка; потребує перевірки менеджером і майстром.`;try{await navigator.clipboard.writeText(txt);alert('Бриф скопійовано')}catch(e){prompt('Скопіюйте бриф:',txt)}}function showAbout(){alert('FILIGREE ARTS Manager Assistant — демонстраційна мобільна версія. Дані моделей умовні. Без серверу, акаунтів та інтеграції з Майстернею.')}render();
</script></body></html>
